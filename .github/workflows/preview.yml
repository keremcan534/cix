name: Preview builds

# Every push builds a phone-testable preview:
#  - web:     https://<owner>.github.io/<repo>/   (GitHub Pages)
#  - android: APK attached to the latest GitHub Release
on:
  push:
    # canli-test only builds the APK (below), so testers get the live-mode app before a merge.
    branches: [ccr-0c79d9d5-0hfb46, main, canli-test]
    paths: ['app/**', '.github/workflows/preview.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  web:
    if: github.ref_name != 'canli-test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Configure base URL for Pages
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json"));
            a.expo.experiments.baseUrl = "/${{ github.event.repository.name }}";
            a.expo.web = { ...a.expo.web, output: "single" };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          '
      # Real voice and the server account (docs/SUNUCU.md). Public addresses, not secrets.
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://130-61-230-94.sslip.io
          EXPO_PUBLIC_LIVEKIT_URL: wss://130-61-230-94.sslip.io
      # SPA fallback so deep links (e.g. /oda/r1) work on Pages.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only the newest push publishes; parallel runs raced on creating the "latest" release.
    concurrency:
      group: android-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the debug keystore (fine for side-loading a preview).
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        # Gradle bundles the JS here; these public addresses switch the APK to live mode (docs/SUNUCU.md).
        env:
          EXPO_PUBLIC_API_URL: https://130-61-230-94.sslip.io
          EXPO_PUBLIC_LIVEKIT_URL: wss://130-61-230-94.sslip.io
          # "Google ile devam et": the web client id from Google Cloud, kept as a repository variable
          # (Settings → Secrets and variables → Actions → Variables). Empty → the APK keeps the device sign-in.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk similar-club.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: Android önizleme #${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **similar-club.apk** dosyasını indir ve aç.
            İlk kurulumda "Bilinmeyen kaynaklardan yüklemeye izin ver" demen gerekebilir.
            Dal: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            Bu APK gerçek sunucuya bağlanır (canlı mod).
          files: app/similar-club.apk
          make_latest: true
