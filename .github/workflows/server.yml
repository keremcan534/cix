name: Server

# server/api: tests on every change against a real Postgres; on the default branch, deploy to the server
# (docs/SUNUCU.md) once the DEPLOY_SSH_KEY secret exists. Without the secret the deploy job only says so.
on:
  push:
    branches: [ccr-0c79d9d5-0hfb46, main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: server/api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running one instead of cutting it off mid-build.
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST || '130.61.230.94' }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the deploy key
        id: key
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is not set: skipping the deploy (see docs/SUNUCU.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy the API and rebuild it on the server
        if: steps.key.outputs.ready == 'true'
        working-directory: .
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy ubuntu@$HOST"
          # /api/health reports this commit, so the check below knows the new version is the one answering.
          echo "$GITHUB_SHA" > server/api/version.txt
          tar -C server -czf - --exclude=node_modules --exclude=test api | $SSH 'tar -C /opt/similar -xzf -'
          $SSH 'cd /opt/similar && sudo docker compose up -d --build api'
      - name: Check the live API
        if: steps.key.outputs.ready == 'true'
        working-directory: .
        run: |
          url="https://${HOST//./-}.sslip.io/api/health"
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 5 "$url" || true)
            if echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\""; then echo "API is up: $body"; exit 0; fi
            sleep 3
          done
          echo "The new API did not answer (last answer: ${body:-none})"; exit 1
