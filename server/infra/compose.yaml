# /opt/similar/compose.yaml: the services of the server (docs/SUNUCU.md). setup.sh copies it to a new
# server and the deploy job (server.yml) keeps it current, keeping the previous copy as compose.yaml.bak.
#
# Everything except Postgres runs on the host network: Caddy reaches LiveKit (7880) and the API (7890) on
# 127.0.0.1, LiveKit needs its UDP ports directly, and LiveKit calls the API's webhook on 127.0.0.1.
name: similar

x-logging: &logging
  # Without a cap, container logs grow until the disk is full.
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB:-$${POSTGRES_USER}}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api:
    build: ./api
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      PGHOST: 127.0.0.1
      LIVEKIT_API_URL: http://127.0.0.1:7880
    depends_on:
      postgres:
        condition: service_healthy
    # The API finishes the requests in flight on SIGTERM (up to 10 s) before it exits.
    stop_grace_period: 15s
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: unless-stopped
    network_mode: host
    # LIVEKIT_KEYS ("key: secret") comes from .env, the same pair the API signs tokens with.
    env_file: .env
    command: ['--config', '/etc/livekit.yaml']
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    logging: *logging

  # Finance Control, the finance panel (docs/SUNUCU.md, "Finans paneli"). Its source comes from its own repo:
  # the deploy job copies it into ./finance next to the Dockerfile. Until then the service stays off: it is in
  # the "finance" profile, which the deploy job turns on in .env (COMPOSE_PROFILES=finance) once the source
  # is there. Only Caddy reaches it (panel.DOMAIN → 127.0.0.1:4300); the API posts events to it on 127.0.0.1.
  finance:
    build: ./finance
    profiles: [finance]
    restart: unless-stopped
    network_mode: host
    # Only the panel's own settings, not the whole .env: the panel never needs the server's other secrets.
    environment:
      FC_HOST: 127.0.0.1
      FC_PORT: '4300'
      FC_DATA_DIR: /data
      FC_COOKIE_SECURE: '1'
      # The first admin. Empty → the panel makes one and writes it to /data/giris-bilgileri.txt.
      FC_ADMIN_EMAIL: ${FC_ADMIN_EMAIL:-}
      FC_ADMIN_PASSWORD: ${FC_ADMIN_PASSWORD:-}
    volumes: ['financedata:/data']
    stop_grace_period: 15s
    logging: *logging

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    network_mode: host
    # DOMAIN for the Caddyfile.
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  financedata:
  caddy_data:
  caddy_config:
