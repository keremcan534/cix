// Güzellik filtresi (video calls): beauty.c built with CMake (src/main/cpp), a WebRTC video effect
// (BeautyEffect). Only the architectures the app is built for (reactNativeArchitectures).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.similarclub'
version = '1.0.0'

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "expo.modules.similarbeauty"
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    externalNativeBuild {
      cmake {
        abiFilters(*reactNativeArchitectures())
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}
